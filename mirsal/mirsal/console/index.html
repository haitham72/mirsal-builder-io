<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Mirsal Sticker Builder</title>
<link rel=stylesheet href=/ui/studio.css>
<div id=app>
 <nav id=rail></nav>
 <aside id=col2></aside>
 <div id=stage>
  <section id=s-generate class=screen>
   <div class=gwrap>
    <aside>
     <h1>Generate</h1><div class=mut style="margin-bottom:8px">Type a prompt: the prepared sheet is keyed, sliced and animated step by step.</div>
     <textarea id=prompt rows=3 placeholder="create teddy yellow bear for school"></textarea>
     <div class=row><button id=go class="btn pri">Generate</button><button id=more class=btn>More</button></div>
     <div id=msg class=mut></div><div id=health></div><div id=list></div>
     <h2 style="margin-top:18px">Prepared inputs</h2><div class=mut>Generate cycles 001 → 002 → … like a new generation each time. Or pick one:</div><div id=inputs></div>
    </aside>
    <main id=main><p class=mut>Type a prompt and press Generate.</p></main>
   </div>
  </section>
  <section id=s-library class=screen></section>
  <section id=s-create class=screen></section>
  <section id=s-editor class=screen></section>
  <section id=s-pack class=screen></section>
  <section id=s-export class=screen></section>
  <section id=s-settings class=screen></section>
  <section id=s-animate class=screen></section>
  <section id=s-chat class=screen></section>
  <section id=s-prepare class=screen></section>
 </div>
</div>
<div id=toast></div><div id=modal></div><div id=dlg></div>
<script src=/ui/app.js></script><script src=/ui/packs.js></script><script src=/ui/editor.js></script><script src=/ui/chat.js></script><script src=/ui/prepare.js></script><script src=/ui/animate.js></script>
