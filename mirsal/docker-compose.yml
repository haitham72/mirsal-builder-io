# Mirsal local services: Postgres (Phase 3A) and Redis (Phase 4, disposable cache / streams / locks).
# Port 5434: 5433 is temporal_note-db, 5436 is sarab-postgres-db on this PC. Redis 6380: 6379 is another project's cache-redis.
# Dev-only password default; override with MIRSAL_PG_PASSWORD (never commit a real one).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mirsal-db
    environment:
      POSTGRES_USER: mirsal
      POSTGRES_PASSWORD: ${MIRSAL_PG_PASSWORD:-mirsal_local}
      POSTGRES_DB: mirsal
    ports:
      - "5434:5432"
    volumes:
      - mirsal_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mirsal-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

volumes:
  mirsal_pgdata:
