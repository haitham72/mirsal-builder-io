# The self-hosted option (an Oracle Always Free VM, any small VPS): the whole thing on one box with a real disk. Run from the repository root:
#   cp deploy/env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker/compose.yml --env-file deploy/.env up -d --build
# Postgres here is the repo's own image (pgvector); with Supabase instead, delete the `db` service and point MIRSAL_DATABASE_URL at the pooler.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mirsal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mirsal
    volumes: [dbdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]       # the cache is disposable on purpose
    restart: unless-stopped
  app:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    environment: &env
      MODE: web
      PORT: "8080"
      MIRSAL_GATEWAY_SECRET: ${MIRSAL_GATEWAY_SECRET:?set MIRSAL_GATEWAY_SECRET (32+ characters)}
      MIRSAL_DATABASE_URL: postgresql://mirsal:${POSTGRES_PASSWORD}@db:5432/mirsal
      MIRSAL_DB_WRITE: "1"
      MIRSAL_REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      MIRSAL_ALLOWED_HOSTS: ${MIRSAL_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MIRSAL_PUBLIC_ORIGIN: ${MIRSAL_PUBLIC_ORIGIN:-}
      MIRSAL_TRACE: ${MIRSAL_TRACE:-none}
      MIRSAL_NO_REAL_CLI: ""
    volumes: [media:/data]
    ports: ["8080:8080"]
    depends_on: [db, redis]
    restart: unless-stopped
  worker:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    environment:
      <<: *env
      MODE: worker
    volumes: [media:/data]
    depends_on: [db, redis]
    restart: unless-stopped
volumes:
  dbdata:
  media:
